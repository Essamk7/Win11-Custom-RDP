name: Windows Custom Environment

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Register your own Windows 11 machine as a self-hosted runner
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Windows information
        shell: pwsh
        run: |
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsArchitecture

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify project structure
        shell: pwsh
        run: |
          $required = @(
            "app/main.py",
            "app/__init__.py",
            "tests/test_api.py"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Missing required file: $file"
            }
          }

      - name: Test FastAPI
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
          API_KEY: test-only-key
        run: |
          python -m pytest -v

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          "Self-hosted Windows runner job completed." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY
