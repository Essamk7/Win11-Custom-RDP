
name: Windows 11 Custom Environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-11-arm

    steps:
      # 1. تنزيل ملفات المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. عرض معلومات نظام التشغيل
      - name: Windows System Information
        shell: pwsh
        run: |
          Get-ComputerInfo |
            Select-Object WindowsProductName,
                          WindowsVersion,
                          OsArchitecture

          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      # 3. إعداد Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. تثبيت المكتبات
      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. التأكد من وجود ملفات المشروع
      - name: Verify Project Files
        shell: pwsh
        run: |
          if (-not (Test-Path "app/main.py")) {
            throw "Missing app/main.py"
          }

          if (-not (Test-Path "tests/test_api.py")) {
            throw "Missing tests/test_api.py"
          }

          if (-not (Test-Path "app/__init__.py")) {
            throw "Missing app/__init__.py"
          }

          Write-Host "Project files verified."

      # 6. اختبار استيراد FastAPI
      - name: Verify FastAPI Import
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "from app.main import app; print('FastAPI import successful')"

      # 7. تشغيل الاختبارات
      - name: Test FastAPI
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -v

      # 8. تشغيل API محلياً واختباره
      - name: Start and Test FastAPI
        shell: pwsh
        env:
          API_KEY: temporary-test-key
          PYTHONPATH: ${{ github.workspace }}
        run: |
          $process = Start-Process `
            -FilePath python `
            -ArgumentList @(
              "-m",
              "uvicorn",
              "app.main:app",
              "--host",
              "127.0.0.1",
              "--port",
              "8000"
            ) `
            -PassThru

          try {
            $ready = $false

            for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2

              try {
                $response = Invoke-RestMethod `
                  -Uri "http://127.0.0.1:8000/health" `
                  -TimeoutSec 3

                if ($response.status -eq "healthy") {
                  $ready = $true
                  break
                }
              }
              catch {
                Write-Host "Waiting for API..."
              }
            }

            if (-not $ready) {
              throw "FastAPI failed to start"
            }

            Write-Host "FastAPI is running successfully."
            $response | ConvertTo-Json
          }
          finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      # 9. ملخص التشغيل
      - name: Workflow Summary
        if: always()
        shell: pwsh
        run: |
          "## Windows Environment Test" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY

          "Runner: windows-11-arm" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          "Python: 3.12" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          "FastAPI and tests completed." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
